name: test
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. copy the repo onto the machine
      - uses: actions/checkout@v5

      # 2. install Node
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # 3. install packages from package-lock.json
      - run: npm ci

      # 4. download Chromium + the Linux libraries it needs
      - run: npx playwright install --with-deps chromium

      # 5. run the tests; env replaces the .env file
      - run: npm test
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          URL: ${{ vars.URL }}

      # 6. save the HTML report, even if tests failed
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
